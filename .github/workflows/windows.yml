name: Build Flick for Windows
on:
  push:
    branches: [main]
    paths: ['helper/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build installer
        working-directory: desktop
        run: |
          copy ..\helper\helper.js helper.js
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --publish never
      - name: Publish
        shell: pwsh
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete windows --yes --cleanup-tag 2>$null
          gh release create windows desktop/dist/Flick-Setup.exe --title "Flick for Windows" --notes "Download **Flick-Setup.exe** and open it. Flick installs like any app (Start menu + desktop icon), starts with Windows and lives near the clock when closed. Uninstall from Settings → Apps."
