<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flick" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>Flick</title>
<style>
  :root { --text:#f5f6fa; --dim:#8b8f9c; --faint:#5a5e6a; --blue:#2f7bff; --ok:#3ddc97;
          --glass:rgba(255,255,255,.055); --edge:rgba(255,255,255,.12); --hi:rgba(255,255,255,.22); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; }
  body { color:var(--text); font:15px/1.4 -apple-system, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }

  /* underglow */
  .glow { position:fixed; left:50%; bottom:-38vh; width:140vw; height:70vh; transform:translateX(-50%); border-radius:50%; z-index:0; pointer-events:none;
          background:radial-gradient(closest-side, rgba(47,123,255,.75), rgba(30,80,220,.35) 45%, transparent 75%); filter:blur(40px); animation:breathe 7s ease-in-out infinite; }
  .glow.b { bottom:-48vh; width:70vw; height:50vh; background:radial-gradient(closest-side, rgba(140,200,255,.55), transparent 70%); animation-delay:-3s; }
  @keyframes breathe { 50% { opacity:.7; transform:translateX(-50%) scale(1.06); } }

  .glass { background:var(--glass); backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%);
           border:1px solid var(--edge); box-shadow:inset 0 1px 0 var(--hi), inset 0 -1px 0 rgba(255,255,255,.04), 0 20px 50px rgba(0,0,0,.5); }

  .app { position:relative; z-index:1; height:100%; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 18px); max-width:1180px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; height:40px; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:700; font-size:19px; letter-spacing:-.4px; }
  .logo img { width:26px; height:26px; border-radius:7px; }
  .me { font-size:13px; color:var(--dim); padding:6px 12px; border-radius:99px; }

  /* island */
  #island { position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:50%; transform:translateX(-50%) translateY(-30px) scale(.8); opacity:0; z-index:30; cursor:pointer;
            background:rgba(20,22,28,.75); backdrop-filter:blur(30px) saturate(170%); -webkit-backdrop-filter:blur(30px) saturate(170%); border-radius:99px; padding:8px 14px 8px 8px; display:flex; align-items:center; gap:10px; min-width:220px;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 0 1px rgba(255,255,255,.1), 0 10px 40px rgba(0,0,0,.6); transition:transform .5s cubic-bezier(.2,1.3,.4,1), opacity .3s; }
  #island.show { transform:translateX(-50%) translateY(0) scale(1); opacity:1; }
  #island .av { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#6aa8ff,#2f5bff); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none; }
  #island .tx { flex:1; line-height:1.2; }
  #island b { display:block; font-size:13px; }
  #island span { font-size:12px; color:var(--dim); }
  #island svg { width:26px; height:26px; flex:none; }
  #island circle.bar { transition:stroke-dashoffset .2s; }

  /* AirDrop-style wave */
  /* AirDrop-style: glow creeps in from every edge, content blurs, a bloom rises from the top edge, then clears */
  #wave { position:fixed; inset:0; z-index:25; pointer-events:none; opacity:0; border-radius:0; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); }
  #wave::before { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 0 rgba(120,175,255,0); }
  #wave::after { content:""; position:absolute; left:-30%; right:-30%; top:-45%; height:70%; border-radius:50%; opacity:0;
                 background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(190,220,255,.75) 35%, rgba(70,140,255,.35) 65%, transparent 100%); filter:blur(18px); transform:scaleY(.2); transform-origin:50% 0; }
  #wave.up, #wave.down { animation:edgeBlur 2.6s cubic-bezier(.4,0,.2,1) forwards; }
  #wave.up::before, #wave.down::before { animation:edgeGlow 2.6s cubic-bezier(.4,0,.2,1) forwards; }
  #wave.up::after, #wave.down::after { animation:bloom 2.6s cubic-bezier(.3,0,.2,1) forwards; }
  @keyframes edgeBlur { 0% { opacity:0; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); } 18% { opacity:1; }
    40% { opacity:1; backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); } 72% { opacity:1; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
    100% { opacity:0; backdrop-filter:blur(0); -webkit-backdrop-filter:blur(0); } }
  @keyframes edgeGlow { 0% { box-shadow:inset 0 0 0 0 rgba(120,175,255,0); }
    35% { box-shadow:inset 0 0 50px 14px rgba(120,175,255,.75), inset 0 0 120px 30px rgba(60,120,255,.35); }
    60% { box-shadow:inset 0 0 70px 22px rgba(190,220,255,.9), inset 0 0 160px 50px rgba(80,140,255,.45); }
    100% { box-shadow:inset 0 0 0 0 rgba(120,175,255,0); } }
  @keyframes bloom { 0%, 30% { opacity:0; transform:scaleY(.2); } 52% { opacity:1; transform:scaleY(1); } 68% { opacity:.9; transform:scaleY(1.35); } 100% { opacity:0; transform:scaleY(1.6); } }

  .lbl { font-size:12px; color:var(--dim); margin:18px 4px 2px; text-align:left; }
  .r .sub { font-size:12px; color:var(--dim); }
  /* tile remove + offer picks */
  .tile .x { position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); font-size:14px; line-height:22px; text-align:center; color:#fff; z-index:2; }
  .tile .vb { position:absolute; left:6px; bottom:6px; font-size:11px; color:#fff; background:rgba(0,0,0,.55); border-radius:6px; padding:1px 5px; z-index:2; }
  .tile video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .pk { position:relative; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:rgba(255,255,255,.06); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; color:var(--dim); padding:6px; text-align:center; word-break:break-all; cursor:pointer; transition:opacity .2s, transform .2s; }
  .pk img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pk .ck { position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; background:#2f7bff; border:2px solid #fff; z-index:2; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .pk.off { opacity:.35; transform:scale(.94); } .pk.off .ck { background:rgba(0,0,0,.5); color:transparent; }
  .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .key { padding:14px 6px; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .key i { font-style:normal; font-size:20px; }
  .key:active { background:rgba(75,141,255,.3); }
  .steps { text-align:left; margin-top:12px; padding:14px 16px; border-radius:16px; background:rgba(47,123,255,.1); border:1px solid rgba(75,141,255,.25); font-size:14px; line-height:1.7; }
  /* icons */
  .ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  /* connection badge */
  .link { display:flex; align-items:center; gap:10px; margin:-4px 0 16px; padding:8px 14px 8px 8px; border-radius:99px; width:max-content; max-width:100%; cursor:pointer; }
  .av { width:30px; height:30px; border-radius:50%; flex:none; background:linear-gradient(135deg,#6aa8ff,#2f5bff) center/cover; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.12); }
  .wire { width:46px; height:2px; flex:none; border-radius:2px; background:linear-gradient(90deg,transparent,#6aa8ff,transparent); background-size:200% 100%; animation:flow 2.2s linear infinite; box-shadow:0 0 10px rgba(80,150,255,.8); }
  .wire.off { background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 4px,transparent 4px 8px); animation:none; box-shadow:none; }
  @keyframes flow { from { background-position:100% 0; } to { background-position:-100% 0; } }
  .dv { width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); color:#bcd4ff; box-shadow:inset 0 1px 0 rgba(255,255,255,.15); }
  .dv .ic { width:18px; height:18px; }
  .link b { font-size:13px; font-weight:600; display:block; line-height:1.2; }
  .link small { font-size:11px; color:var(--dim); }
  /* remote */
  .hero { display:flex; align-items:center; gap:14px; padding:16px; border-radius:22px; margin-top:16px; background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.2); }
  .hero .dv { width:48px; height:48px; border-radius:14px; color:#cfe0ff; box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 0 24px rgba(80,150,255,.35); }
  .hero .dv .ic { width:26px; height:26px; }
  .hero .tx { flex:1; min-width:0; text-align:left; } .hero b { display:block; font-size:16px; } .hero small { color:var(--dim); font-size:12px; }
  .bat { position:relative; width:54px; height:54px; flex:none; }
  .bat svg { width:54px; height:54px; transform:rotate(-90deg); }
  .bat span { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:600; line-height:1; gap:1px; }
  .shot { margin-top:10px; border-radius:18px; overflow:hidden; aspect-ratio:16/9; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; gap:8px; color:var(--dim); font-size:13px; cursor:pointer; position:relative; }
  .shot img { width:100%; height:100%; object-fit:cover; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .tl { aspect-ratio:1; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; font-size:11px; color:var(--dim);
        background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025)); border:1px solid rgba(255,255,255,.08); box-shadow:inset 0 1px 0 rgba(255,255,255,.14); transition:transform .15s, background .2s; }
  .tl .ic { color:#e8eefc; filter:drop-shadow(0 0 6px rgba(120,170,255,.45)); }
  .tl:active { transform:scale(.94); background:rgba(75,141,255,.25); }
  .tl.warn .ic { color:#ff9b9b; filter:drop-shadow(0 0 6px rgba(255,90,90,.5)); }
  .pad { margin-top:16px; height:46vh; border-radius:24px; touch-action:none; display:flex; align-items:flex-end; justify-content:center; padding:14px; color:var(--faint); font-size:12px;
         background:radial-gradient(120% 80% at 50% 120%, rgba(47,123,255,.25), transparent 60%), rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.15); }
  .kb { display:flex; gap:8px; margin-top:10px; }
  .kb input { flex:1; margin:0; font:500 15px inherit; font-family:inherit; letter-spacing:0; text-align:left; padding:13px 14px; }
  .me-row { display:flex; align-items:center; gap:14px; margin-top:16px; padding:14px; border-radius:20px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); text-align:left; }
  .me-row .av { width:56px; height:56px; font-size:22px; cursor:pointer; }
  .me-row b { display:block; font-size:16px; } .me-row small { color:var(--dim); font-size:13px; }
  .ring-btn { display:flex; align-items:center; gap:6px; }
  .people { display:flex; gap:16px; overflow-x:auto; padding:12px 8px 14px; scrollbar-width:none; }
  .people::-webkit-scrollbar { display:none; }
  .person { flex:none; width:68px; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:12px; color:var(--dim); cursor:pointer; text-align:center;
            animation:popIn .55s cubic-bezier(.2,1.5,.4,1) backwards; animation-delay:calc(var(--i, 0) * 70ms); transition:transform .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { from { opacity:0; transform:translateY(10px) scale(.6); } }
  .person:hover { transform:translateY(-3px); }
  .person:active { transform:scale(.9); transition-duration:.1s; }
  .person .av, .person .dv { width:56px; height:56px; border-radius:50%; font-size:20px; transition:transform .4s cubic-bezier(.2,1.4,.4,1), box-shadow .4s; }
  .person .dv .ic { width:24px; height:24px; }
  .person span { max-width:68px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .person.sel .av, .person.sel .dv { transform:scale(1.07); animation:selGlow 2.4s ease-in-out infinite; }
  @keyframes selGlow { 0%, 100% { box-shadow:0 0 0 2px #fff, 0 0 0 4px #4b8dff, 0 0 18px rgba(75,141,255,.6); } 50% { box-shadow:0 0 0 2px #fff, 0 0 0 5px #6aa8ff, 0 0 34px rgba(75,141,255,.95); } }
  .person span { transition:color .3s; } .person.sel span { color:#fff; }
  .person.catch .av, .person.catch .dv { animation:catchIt .7s cubic-bezier(.2,1.6,.4,1); }
  @keyframes catchIt { 0% { transform:scale(1.07); } 30% { transform:scale(.86); box-shadow:0 0 0 2px #fff, 0 0 0 6px #9cc4ff, 0 0 50px rgba(150,200,255,1); } 100% { transform:scale(1.07); } }
  #vis { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); }
  #vis i { position:relative; width:34px; height:20px; border-radius:99px; background:rgba(255,255,255,.12); transition:background .3s; box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
  #vis i::after { content:""; position:absolute; left:2px; top:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.4); transition:transform .35s cubic-bezier(.2,1.4,.4,1); }
  #vis.on i { background:linear-gradient(180deg,#4b8dff,#2a62f0); box-shadow:0 0 12px rgba(75,141,255,.6); } #vis.on i::after { transform:translateX(14px); }
  .big { width:100%; max-height:55vh; object-fit:contain; border-radius:18px; margin-top:16px; background:#000; }

  main { flex:1; display:flex; flex-direction:column; min-height:0; gap:18px; }
  .desk main { flex-direction:row; }
  .col { display:flex; flex-direction:column; min-height:0; }
  .desk .col { flex:1; }
  .title { font-size:34px; font-weight:600; letter-spacing:-1px; line-height:1.05; margin:18px 0 16px; }
  .title span { color:var(--faint); }

  /* glowing drop box */
  .stage { position:relative; border-radius:28px; min-height:200px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
           background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.16);
           box-shadow:inset 0 0 30px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 6px rgba(255,255,255,.02), 0 0 60px rgba(120,170,255,.08);
           backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); transition:box-shadow .3s; }
  .desk .stage { flex:1; }
  .stage.over, .stage.ready { box-shadow:inset 0 0 40px rgba(140,190,255,.18), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 6px rgba(120,170,255,.06), 0 0 80px rgba(80,140,255,.25); }
  .hint .ring { width:44px; height:44px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; background:#000; box-shadow:0 0 0 1px rgba(255,255,255,.15), 0 0 24px rgba(255,255,255,.12); }
  .hint b { display:block; font-weight:600; font-size:16px; }
  .hint small { color:var(--dim); font-size:13px; }
  .tray { display:flex; gap:10px; overflow-x:auto; padding:4px; max-width:100%; scrollbar-width:none; }
  .tile { flex:none; width:92px; height:118px; border-radius:16px; overflow:hidden; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; font-size:11px; color:var(--dim); word-break:break-all; }
  .tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .chip { position:absolute; left:0; top:0; cursor:grab; touch-action:none; }

  @keyframes genieOut {
    0% { transform:var(--at,none); clip-path:inset(0 0 0 0 round 16px); opacity:1; filter:none; }
    30% { transform:var(--at,none) translateY(-14px) scale(1.07); clip-path:inset(0 0 0 0 round 16px); filter:drop-shadow(0 0 22px rgba(140,190,255,.9)) brightness(1.15); }
    55% { transform:var(--at,none) translateY(-40px) scaleY(1.12); clip-path:polygon(22% 0,78% 0,100% 100%,0 100%); filter:drop-shadow(0 0 30px rgba(160,200,255,1)) brightness(1.3); }
    100% { transform:var(--at,none) translateY(-110vh) scaleY(.4); clip-path:polygon(49% 0,51% 0,53% 100%,47% 100%); opacity:0; filter:drop-shadow(0 0 40px #fff) brightness(1.6); } }
  @keyframes genieIn {
    0% { transform:translateY(-60vh) scaleY(.4); clip-path:polygon(49% 0,51% 0,53% 100%,47% 100%); opacity:0; filter:drop-shadow(0 0 40px #fff) brightness(1.6); }
    45% { clip-path:polygon(40% 0,60% 0,80% 100%,20% 100%); opacity:1; }
    75% { transform:translateY(6px) scaleY(1.04); clip-path:inset(0 0 0 0 round 0); filter:drop-shadow(0 0 20px rgba(140,190,255,.8)) brightness(1.15); }
    100% { transform:none; filter:none; } }
  .out { animation:genieOut 1.7s cubic-bezier(.45,0,.2,1) forwards; pointer-events:none; }
  .in { animation:genieIn 1.5s cubic-bezier(.2,.8,.2,1); }

  /* dock */
  .dock { display:flex; gap:8px; padding:7px; border-radius:24px; margin-top:14px; }
  .dock button { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:18px; font-size:12px; color:var(--dim); }
  .dock button svg { width:22px; height:22px; stroke:var(--text); }
  .dock button.main { background:linear-gradient(180deg,#4b8dff,#2a62f0); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px rgba(47,123,255,.4); }
  .dock button.main svg { stroke:#fff; }
  #motionRow { margin-top:10px; padding:13px; border-radius:18px; text-align:center; font-weight:600; font-size:14px; }

  /* folders */
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:4px 2px 12px; }
  .sec h2 { font-size:15px; font-weight:600; }
  .sec button { font-size:13px; color:var(--dim); }
  .folders { display:flex; gap:16px; overflow-x:auto; padding:30px 4px 6px; scrollbar-width:none; }
  .desk .folders { flex-wrap:wrap; overflow:auto; align-content:flex-start; }
  .folders::-webkit-scrollbar { display:none; }
  .fold { flex:none; width:132px; cursor:pointer; }
  .fv { position:relative; width:132px; height:104px; }
  .fv .back { position:absolute; inset:0 0 6px 0; border-radius:12px; background:linear-gradient(#2a2c33,#17181c); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  .fv .back::before { content:""; position:absolute; left:10px; top:-7px; width:46px; height:12px; border-radius:6px 6px 0 0; background:#2a2c33; }
  .fv .paper { position:absolute; left:18px; right:18px; top:-18px; height:80px; border-radius:8px; background:#e9ebf0; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.4); transform-origin:bottom; }
  .fv .paper img { width:100%; height:100%; object-fit:cover; }
  .fv .paper:nth-of-type(2) { transform:rotate(-7deg) translateX(-10px); }
  .fv .paper:nth-of-type(3) { transform:rotate(6deg) translateX(10px) translateY(4px); }
  .fv .paper .ln { height:6px; margin:10px 10px 0; border-radius:3px; background:#c9ccd4; }
  .fv .paper .ln.s { width:50%; }
  .fv .paper .big { font-size:28px; text-align:center; margin-top:14px; }
  .fv .front { position:absolute; left:0; right:0; bottom:0; height:68px; border-radius:12px;
               background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
               border:1px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .fv .front::before { content:""; position:absolute; right:0; top:-1px; width:56%; height:14px; border-radius:0 12px 0 0; }
  .fold .lb { margin-top:10px; font-size:13px; font-weight:500; }
  .fold .sb { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--faint); font-size:14px; padding:20px 4px; }

  /* sheets */
  .modal { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; }
  .desk .modal { align-items:center; }
  .modal.show { display:flex; }
  .sheet { width:100%; max-width:440px; max-height:80vh; overflow:auto; border-radius:30px; padding:24px 20px calc(env(safe-area-inset-bottom) + 20px); background:rgba(22,23,28,.82); animation:rise .45s cubic-bezier(.2,1,.3,1); }
  .phone .sheet { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  @keyframes rise { from { transform:translateY(40px); opacity:0; } }
  .sheet h3 { font-size:20px; font-weight:600; text-align:center; }
  .sheet p { color:var(--dim); font-size:14px; text-align:center; margin-top:4px; }
  .code { font:600 46px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing:12px; text-align:center; margin:22px 0 6px; padding-left:12px; text-shadow:0 0 24px rgba(120,170,255,.5); }
  .sheet input { width:100%; margin-top:14px; padding:14px; border-radius:16px; border:1px solid var(--edge); background:rgba(0,0,0,.4); color:#fff; font:600 24px ui-monospace, Consolas, monospace; text-align:center; letter-spacing:8px; }
  .or { margin-top:22px !important; font-size:12px !important; }
  .btns { display:flex; gap:10px; margin-top:20px; }
  .btn { flex:1; padding:15px; border-radius:18px; font-weight:600; background:rgba(255,255,255,.08); border:1px solid var(--edge); }
  .btn.pri { background:linear-gradient(180deg,#4b8dff,#2a62f0); border-color:transparent; box-shadow:inset 0 1px 0 rgba(255,255,255,.4); }
  .rows { margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .r { display:flex; align-items:center; gap:12px; padding:10px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06); cursor:pointer; }
  .r .th { width:44px; height:44px; border-radius:10px; flex:none; object-fit:cover; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .r .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .r .nm.wrap { white-space:normal; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .r .act { color:#8fb8ff; font-weight:600; font-size:14px; }

  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translate(-50%,120px); padding:11px 18px; border-radius:99px; font-size:14px; transition:transform .35s cubic-bezier(.2,1.2,.3,1); z-index:50; white-space:nowrap; }
  #toast.show { transform:translate(-50%,0); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="glow"></div><div class="glow b"></div>
<div id="wave"></div>
<div id="island"><div class="av" id="isAv"></div><div class="tx"><b id="isName"></b><span id="isStat"></span></div>
  <svg viewBox="0 0 36 36" id="isRing"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/><circle class="bar" cx="18" cy="18" r="15" fill="none" stroke="#4b8dff" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/></svg>

<div class="app">
  <header>

  <main>
    <div class="col">

        <div class="hint" id="hint"></div>

      </div>
      <div class="dock glass phone-only">
        <button class="main" id="pick"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
        <button id="cam"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
        <button id="scan"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>Scan</button>
        <button id="remote"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Laptop</button>
        <button id="sendText"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copied</button>
      </div>

</div>

<div class="modal" id="modal"><div class="sheet glass" id="sheet"></div></div>
<div id="toast" class="glass"></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script>
// ---------- basics ----------
const $ = (s) => document.querySelector(s);
const isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
document.body.classList.add(isPhone ? 'phone' : 'desk');
document.querySelectorAll('.phone-only').forEach((e) => !isPhone && e.classList.add('hidden'));

const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const rid = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, '0')).join('');
const me = store.get('me') || { id: rid(6), name: isPhone ? 'My iPhone' : 'My laptop' };
me.kind = isPhone ? 'phone' : 'desk'; store.set('me', me);
const UA = navigator.userAgent;
me.model = /iPhone/.test(UA) ? 'iPhone' : /iPad/.test(UA) || (navigator.maxTouchPoints > 1 && /Mac/.test(UA)) ? 'iPad' : /Android/.test(UA) ? ((UA.match(/Android [\d.]+; ([^;)]+)/) || [])[1] || 'Android phone').replace(/ Build.*/, '') : /Windows/.test(UA) ? 'Windows PC' : /Mac/.test(UA) ? 'Mac' : 'Computer';
navigator.userAgentData?.getHighEntropyValues?.(['model']).then((v) => { if (v.model) { me.model = v.model; store.set('me', me); } }).catch(() => {});
let avatars = store.get('avatars', {}); // peer id -> small photo
let keys = store.get('keys', {});       // laptop id -> remote-control key
const I = {
  laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>', prev: '<path d="M15 6l-6 6 6 6"/>', next: '<path d="M9 6l6 6-6 6"/>',
  tprev: '<path d="M18 6v12L10 12zM6 6v12"/>', tnext: '<path d="M6 6v12l8-6zM18 6v12"/>',
  vdown: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 12h4"/>', vup: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 12h5M18 9.5v5"/>',
  mute: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  present: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8.5 20h7M10 8l4 2-4 2z"/>', stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
  desktop: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  folder: '<path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  youtube: '<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.5 9.5v5l4-2.5z"/>', music: '<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  lock: '<rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  restart: '<path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/>', power: '<path d="M12 3v8"/><path d="M6.4 7a8 8 0 1 0 11.2 0"/>',
  pointer: '<path d="M6 3l12 8-5.5 1.5L10 18z"/>', keyboard: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14.5h10"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', bolt: '<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>', user: '<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.5-4 4.3-5.5 7.5-5.5s6 1.5 7.5 5.5"/>',
};
const ico = (n) => `<svg class="ic" viewBox="0 0 24 24">${I[n] || ''}</svg>`;
const avatarHtml = (src, name, cls = 'av') => src ? `<div class="${cls}" style="background-image:url('${src}')"></div>` : `<div class="${cls}">${esc((name || '?').trim()[0] || '?').toUpperCase()}</div>`;
const devIcon = (p) => `<div class="dv">${ico(p?.kind === 'phone' ? 'phone' : 'laptop')}</div>`;
let trusted = store.get('trusted', {});
const peers = new Map();
let pending = null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buzz = (p) => navigator.vibrate && navigator.vibrate(p);
const isImg = (f) => /^image\//.test(f.type || '') && !/heic/i.test(f.type) || /\.(jpe?g|png|gif|webp)$/i.test(f.name || '');
const isVid = (f) => /^video\//.test(f.type || '') || /\.(mov|mp4)$/i.test(f.name || '');
const isT = (x) => typeof x?.text === 'string';
const isUrl = (t) => /^https?:\/\/\S+$/i.test((t || '').trim());
const icon = (f) => isVid(f) ? '🎬' : /\.pdf$/i.test(f.name) ? '📄' : /\.(zip|rar|7z)$/i.test(f.name) ? '🗜️' : '📁';

function toast(t, onTap) { const el = $('#toast'); el.textContent = t; el.onclick = onTap || null; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), onTap ? 5000 : 2600); }

// ---------- island + wave ----------
let isTimer;
function island(name, stat, pct) {
  const el = $('#island');
  $('#isAv').textContent = (name || '?').trim()[0].toUpperCase();
  $('#isName').textContent = name; $('#isStat').textContent = stat;
  $('#isRing').style.display = pct == null ? 'none' : '';
  if (pct != null) $('#isRing .bar').style.strokeDashoffset = 94.2 * (1 - pct);
  el.classList.add('show'); clearTimeout(isTimer);
  if (pct == null || pct >= 1) isTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function flyUp(el, delay = 0) {
  const r = el.getBoundingClientRect(), c = el.cloneNode(true);
  c.className = 'tile glass out';
  Object.assign(c.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 27, transform: 'none', animationDelay: delay + 'ms' });
  c.style.removeProperty('--at'); c.querySelector('.x')?.remove();
  document.body.append(c); el.style.visibility = 'hidden';
  setTimeout(() => c.remove(), 1900 + delay);
}
function wave(dir) { const w = $('#wave'); w.className = ''; void w.offsetWidth; w.className = dir; sfx(dir); }
let ac;
const unlockAudio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch {} };
addEventListener('pointerdown', unlockAudio, { passive: true });
function sfx(kind) { // soft water-drop "plip"s: two rising for send, one landing + warm note for receive
  if (!ac) return; const t0 = ac.currentTime;
  const out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination);
  const drop = (t, from, to, vol) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(out); o.start(t); o.stop(t + 0.25);
  };
  const glow = (t, hz, vol) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g).connect(out); o.start(t); o.stop(t + 1);
  };
  if (kind === 'up') { drop(t0 + 0.55, 520, 1250, 0.35); drop(t0 + 0.72, 700, 1650, 0.25); glow(t0 + 0.75, 1318.5, 0.04); }
  else { drop(t0 + 0.5, 1400, 480, 0.35); glow(t0 + 0.62, 659.3, 0.05); glow(t0 + 0.62, 987.8, 0.03); }
}


// ---------- finding devices ----------
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const T = 'flickapp/v1';
let mq, room;
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('flick:' + s)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
async function start() {
  await Promise.race([helperReady, new Promise((r) => setTimeout(r, 900))]);
  let ip = 'unknown';
  try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch {}
  room = (await sha(ip)).slice(0, 20);
  connectBroker(0);
}
function connectBroker(i) {
  mq = mqtt.connect(BROKERS[i % BROKERS.length], { clientId: 'fl_' + me.id + '_' + rid(2), clean: true, connectTimeout: 6000, reconnectPeriod: 3000 });
  let ok = false;
  mq.on('connect', () => { ok = true; mq.subscribe([`${T}/room/${room}`, `${T}/dev/${me.id}`]); hello(); });
  mq.on('message', (_t, buf) => { try { onSignal(JSON.parse(buf.toString())); } catch {} });
  setTimeout(() => { if (!ok) { mq.end(true); connectBroker(i + 1); } }, 7000);
}
const pub = (topic, msg) => mq?.connected && mq.publish(topic, JSON.stringify({ ...msg, from: me.id, name: me.name, kind: me.kind, model: me.model }));
const toDev = (id, msg) => pub(`${T}/dev/${id}`, msg);
if (me.visible === undefined) { me.visible = true; store.set('me', me); }
if (me.avatar && !me.avatarSm) { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 48; c.getContext('2d').drawImage(i, 0, 0, 48, 48); me.avatarSm = c.toDataURL('image/jpeg', .7); store.set('me', me); }; i.src = me.avatar; }
function hello() { pub(`${T}/room/${room}`, { type: 'hello', ...(me.visible ? { open: 1, av: me.avatarSm || '' } : {}) }); for (const id in trusted) toDev(id, { type: 'hello' }); }
setInterval(hello, 5000);

function seen(m) {
  if (m.from === me.id) return null;
  let p = peers.get(m.from); if (!p) { p = { id: m.from }; peers.set(m.from, p); }
  p.name = m.name; p.kind = m.kind; p.seen = Date.now(); if (m.type === 'hello') { p.open = !!m.open; if (m.av) p.av = m.av; } if (m.model) p.model = m.model; if (m.helper) p.helperSeen = Date.now();
  if (trusted[p.id] && trusted[p.id] !== p.name) { trusted[p.id] = p.name; store.set('trusted', trusted); }
  return p;
}
function acceptSheet(p, extra) {
  showSheet(`<h3>${esc(p.name)} wants to pair</h3>${extra}
    <div class="btns"><button class="btn" data-a="no">Decline</button><button class="btn pri" data-a="yes">Pair</button></div>`, (a) => {
    if (a === 'yes') { trust(p); toDev(p.id, { type: 'pair-ok' }); paired(p); } else toDev(p.id, { type: 'pair-no' });
  });
}
function paired(p) { island(p.name, 'Paired'); wave('down'); buzz([15, 40, 15]); link(p); }
async function onSignal(m) {
  const p = seen(m); if (!p) return;
  if (m.type === 'hello') { renderDevices(); link(p); }
  if (m.type === 'pair-req') { if (m.avatar) setAvatar(p.id, m.avatar); if (helperInfo) return; acceptSheet(p, `<p>Check this code shows on ${esc(p.name)}</p><div class="code">${esc(m.code)}</div>`); }
  if (m.type === 'pair-key' && pending?.id === p.id && pending.kp) {
    const lap = b64d(m.pub); pending.lapPub = lap;
    const code = await sasCode(pending.myPub, lap);
    showSheet(`<h3>Check your laptop</h3><p>Click <b>Yes</b> on ${esc(p.name)} if it shows this code</p><div class="code">${code}</div>
      <div class="btns"><button class="btn" data-a="cancel">Cancel</button></div>`, () => (pending = null));
  }
  if (m.type === 'pair-ok' && pending?.id === p.id && pending.lapPub && m.ct) {
    try {
      const raw = await deriveKey(pending.kp, pending.lapPub);
      await openBox(raw, m); keys[p.id] = b64e(raw); store.set('keys', keys);
    } catch { pending = null; return toast('Pairing failed'); }
    pending = null; trust(p); closeSheet(); paired(p); return;
  }
  if (m.type === 'code-join' && pending?.code) { pending = null; acceptSheet(p, '<p>Entered your code</p>'); }
  if (m.type === 'pair-ok' && pending && (pending.id === p.id || pending.joining)) { pending = null; trust(p); closeSheet(); paired(p); }
  if (m.type === 'pair-no' && pending) { pending = null; closeSheet(); toast(p.name + ' declined'); }
  if (m.type === 'sig' && (trusted[p.id] || me.visible)) onRtc(p, m.data);
  if (m.type === 'res' && keys[p.id]) onRes(p, m);
}
function trust(p) { trusted[p.id] = p.name; store.set('trusted', trusted); renderDevices(); }
function forget(p) {
  if (keys[p.id]) { sealFor(p.id, { a: 'unpair', ts: Date.now(), n: rid(8) }).then((b) => toDev(p.id, { type: 'unpair', ...b })).catch(() => {}); delete keys[p.id]; store.set('keys', keys); }
  if (helperInfo) helperSend({ t: 'forget', id: p.id });
  delete trusted[p.id]; store.set('trusted', trusted); drop(p); renderDevices();
}
function setAvatar(id, src) { if (!src || src.length > 20000) return; avatars[id] = src; store.set('avatars', avatars); renderTitle(); }

// ---------- keys (each paired laptop gets its own) ----------
const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function sasCode(a, b) { const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new Uint8Array([...a, ...b]))); return String(new DataView(h.buffer).getUint32(0) % 10000).padStart(4, '0'); }
async function deriveKey(kp, lapPub) {
  const peer = await crypto.subtle.importKey('raw', lapPub, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
  return new Uint8Array(await crypto.subtle.digest('SHA-256', await crypto.subtle.deriveBits({ name: 'ECDH', public: peer }, kp.privateKey, 256)));
}
const aes = (raw) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
async function sealFor(id, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aes(b64d(keys[id])), new TextEncoder().encode(JSON.stringify(obj)));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function openBox(raw, { iv, ct }) { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(iv) }, await aes(raw), b64d(ct)))); }

// ---------- direct link (files never touch a server) ----------
const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
function link(p) { if (trusted[p.id] && !p.pc && me.id < p.id) makePc(p, true); }
function makePc(p, initiator) {
  const pc = new RTCPeerConnection(ICE); p.pc = pc;
  pc.onicecandidate = (e) => e.candidate && toDev(p.id, { type: 'sig', data: { c: e.candidate } });
  pc.onconnectionstatechange = () => { if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) drop(p); };
  if (initiator) {
    setupDc(p, pc.createDataChannel('flick'));
    pc.createOffer().then((o) => pc.setLocalDescription(o)).then(() => toDev(p.id, { type: 'sig', data: { sdp: pc.localDescription } }));
  } else pc.ondatachannel = (e) => setupDc(p, e.channel);
  setTimeout(() => { if (p.pc === pc && p.dc?.readyState !== 'open') drop(p); }, 15000);
  return pc;
}
async function onRtc(p, d) {
  if (d.sdp?.type === 'offer') {
    if (p.pc) drop(p);
    const pc = makePc(p, false);
    await pc.setRemoteDescription(d.sdp);
    await pc.setLocalDescription(await pc.createAnswer());
    toDev(p.id, { type: 'sig', data: { sdp: pc.localDescription } });
  } else if (d.sdp?.type === 'answer' && p.pc) await p.pc.setRemoteDescription(d.sdp).catch(() => {});
  else if (d.c && p.pc) await p.pc.addIceCandidate(d.c).catch(() => {});
}
function drop(p) { try { p.dc?.close(); p.pc?.close(); } catch {} p.pc = p.dc = null; renderDevices(); }

function setupDc(p, dc) {
  dc.binaryType = 'arraybuffer'; p.dc = dc;
  let batch = null, cur = null;
  dc.onopen = () => { renderDevices(); island(p.name, 'Connected'); buzz(20); dc.send(JSON.stringify({ t: 'profile', avatar: me.avatar || '', model: me.model })); };
  dc.onclose = () => drop(p);
  dc.onmessage = (e) => {
    if (typeof e.data !== 'string') { if (cur) { cur.parts.push(e.data); cur.got += e.data.byteLength; batch.got += e.data.byteLength; if (batch.total) island(p.name, `Receiving · ${Math.round(100 * batch.got / batch.total)}%`, batch.got / batch.total); } return; }
    const m = JSON.parse(e.data);
    if (m.t === 'profile') { if (m.avatar) setAvatar(p.id, m.avatar); if (m.model) p.model = m.model; return; }
    if (m.t === 'ring') { if (trusted[p.id]) ringMe(p.name); return; }
    if (m.t === 'offer') { offerSheet(p, m); return; }
    if (m.t === 'cancel') { if ($('#sheet').dataset.k === 'offer:' + m.id) { closeSheet(); toast(p.name + ' cancelled'); } return; }
    if ((m.t === 'accept' || m.t === 'decline') && outgoing?.id === m.id) { outgoing.done(m); return; }
    if (m.t === 'batch') { batch = { id: m.id, from: p.name, time: Date.now(), total: m.total, got: 0, items: [] }; wave('down'); island(p.name, 'Receiving', 0); }
    if (m.t === 'file') cur = { ...m, parts: [], got: 0 };
    if (m.t === 'end' && cur) { batch.items.push(new File(cur.parts, cur.name, { type: cur.mime || '' })); cur = null; }
    if (m.t === 'text') batch.items.push({ text: m.text });
    if (m.t === 'done' && batch) { received(batch); batch = null; }
  };
}
const live = () => [...peers.values()].filter((p) => p.dc?.readyState === 'open');

async function thumb(f) {
  const draw = (el, w, h) => { const k = 240 / Math.max(w, h), c = document.createElement('canvas'); c.width = w * k; c.height = h * k; c.getContext('2d').drawImage(el, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .6); };
  try {
    if (isImg(f)) { const i = new Image(); i.src = URL.createObjectURL(f); await i.decode(); return draw(i, i.naturalWidth, i.naturalHeight); }
    if (isVid(f)) return await new Promise((ok) => {
      const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(f) + '#t=0.1';
      v.onloadeddata = () => setTimeout(() => { try { ok(draw(v, v.videoWidth, v.videoHeight)); } catch { ok(null); } }, 150);
      v.onerror = () => ok(null); setTimeout(() => ok(null), 2500);
    });
  } catch {}
  return null;
}

async function ensureLink(p) {
  if (isOn(p)) return true;
  if (!p.pc) makePc(p, true);
  for (let i = 0; i < 60 && !isOn(p); i++) await new Promise((r) => setTimeout(r, 200));
  return isOn(p);
}
async function sendBatch(items, target) {
  const p = target || targetPeer();
  if (!p) { toast(Object.keys(trusted).length ? 'Open Flick on your other device' : 'Tap someone in Nearby, or pair a device'); return false; }
  if (!isOn(p)) { island(p.name, 'Connecting', null); if (!(await ensureLink(p))) { island(p.name, 'Couldn’t connect', null); return false; } }
  const dc = p.dc, id = rid(4);
  const av = $(`#people .person[data-id="${p.id}"]`); if (av) { av.classList.remove('catch'); void av.offsetWidth; av.classList.add('catch'); setTimeout(() => av.classList.remove('catch'), 800); }
  const meta = await Promise.all(items.map(async (x) => isT(x) ? { text: x.text } : { name: x.name, size: x.size, type: x.type, thumb: await thumb(x) }));
  wave('up'); buzz([10, 30, 10]);
  dc.send(JSON.stringify({ t: 'offer', id, items: meta }));
  island(p.name, 'Waiting · tap to cancel', null); clearTimeout(isTimer);
  const ans = await new Promise((ok) => {
    const t = setTimeout(() => ok({ t: 'timeout' }), 90000);
    outgoing = { id, done: (m) => { clearTimeout(t); ok(m); }, cancel: () => { dc.send(JSON.stringify({ t: 'cancel', id })); clearTimeout(t); ok({ t: 'cancelled' }); } };
  });
  outgoing = null;
  if (ans.t !== 'accept') { island(p.name, ans.t === 'decline' ? 'Declined' : ans.t === 'cancelled' ? 'Cancelled' : 'No answer', null); return true; }
  const chosen = items.filter((_, i) => ans.pick.includes(i));
  const total = chosen.reduce((s, x) => s + (x.size || 0), 0); let sent = 0;
  dc.send(JSON.stringify({ t: 'batch', id, total }));
  island(p.name, 'Sending', 0);
  for (const x of chosen) {
    if (isT(x)) { dc.send(JSON.stringify({ t: 'text', text: x.text })); continue; }
    dc.send(JSON.stringify({ t: 'file', name: x.name, size: x.size, mime: x.type }));
    const buf = await x.arrayBuffer(), CH = 64 * 1024;
    dc.bufferedAmountLowThreshold = 1 << 20;
    for (let o = 0; o < buf.byteLength; o += CH) {
      if (dc.bufferedAmount > 8 << 20) await new Promise((r) => dc.addEventListener('bufferedamountlow', r, { once: true }));
      dc.send(buf.slice(o, o + CH)); sent += Math.min(CH, buf.byteLength - o);
      if (total) island(p.name, `Sending · ${Math.round(100 * sent / total)}%`, sent / total);
    }
    dc.send(JSON.stringify({ t: 'end' }));
  }
  dc.send(JSON.stringify({ t: 'done' }));
  island(p.name, chosen.length < items.length ? `Sent ${chosen.length} of ${items.length}` : 'Sent', total ? 1 : null);
  return true;
}

function offerSheet(p, m) {
  const keep = m.items.map(() => true);
  if (m.items.every(isT)) return p.dc.send(JSON.stringify({ t: 'accept', id: m.id, pick: m.items.map((_, i) => i) }));
  buzz([10, 40, 10]);
  const tiles = m.items.map((x, i) => `<div class="pk" data-a="k${i}">${isT(x) ? `<div style="font-size:26px">${isUrl(x.text) ? '🔗' : '💬'}</div>${esc(x.text.slice(0, 40))}`
    : x.thumb ? `<img src="${x.thumb}">` : `<div style="font-size:26px">${icon(x)}</div>${esc(x.name)}`}<div class="ck">✓</div></div>`).join('');
  showSheet(`<h3>${esc(p.name)}</h3><p>Wants to send ${esc(describe(m.items))}</p><div class="grid">${tiles}</div>
    <div class="btns"><button class="btn" data-a="no">Decline</button><button class="btn pri" data-a="yes" id="accBtn">Accept</button></div>`, (a) => {
    if (a[0] === 'k') { const i = +a.slice(1); keep[i] = !keep[i]; $(`[data-a="k${i}"]`).classList.toggle('off', !keep[i]); const n = keep.filter(Boolean).length; $('#accBtn').textContent = n === keep.length ? 'Accept' : n ? `Accept ${n}` : 'Accept'; return 'keep'; }
    if (a === 'yes') { const pick = keep.map((k, i) => k ? i : -1).filter((i) => i >= 0); p.dc.send(JSON.stringify(pick.length ? { t: 'accept', id: m.id, pick } : { t: 'decline', id: m.id })); }
    if (a === 'no') p.dc.send(JSON.stringify({ t: 'decline', id: m.id }));
  }, 'offer:' + m.id);
}

async function askPair(p) {
  const code = String(Math.floor(1000 + Math.random() * 9000));
  pending = { id: p.id };
  if (Date.now() - (p.helperSeen || 0) < 20000) { // laptop with Flick for Windows: exchange keys, confirm on the laptop
    const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
    pending = { id: p.id, kp, myPub: new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)) };
    toDev(p.id, { type: 'pair-req', code, pub: b64e(pending.myPub), avatar: me.avatar || '' });
    return showSheet(`<h3>Connecting to ${esc(p.name)}</h3><p>A box will pop up on the laptop</p><div class="btns"><button class="btn" data-a="cancel">Cancel</button></div>`, () => (pending = null));
  }
  toDev(p.id, { type: 'pair-req', code, avatar: me.avatar || '' });
  showSheet(`<h3>Pairing with ${esc(p.name)}</h3><p>Accept this code on ${esc(p.name)}</p><div class="code">${code}</div>
    <div class="btns"><button class="btn" data-a="cancel">Cancel</button></div>`, () => (pending = null));
}
function codeSheet() {
  const code = String(Math.floor(1000 + Math.random() * 9000));
  pending = { code }; mq?.subscribe(`${T}/code/${code}`);
  showSheet(`<h3>Pair with a code</h3><p>Enter this on your other device</p><div class="code">${code}</div>
    <p class="or">Or enter theirs</p><input id="codeIn" inputmode="numeric" maxlength="4" placeholder="····" />
    <div class="btns"><button class="btn" data-a="cancel">Cancel</button><button class="btn pri" data-a="join">Connect</button></div>`, (a) => {
    mq?.unsubscribe(`${T}/code/${code}`);

      const v = ($('#codeIn').value || '').trim();
      if (!/^\d{4}$/.test(v)) { toast('Enter 4 digits'); return 'keep'; }

}

const DB = new Promise((ok) => { const r = indexedDB.open('flick', 1); r.onupgradeneeded = () => r.result.createObjectStore('b', { keyPath: 'id' }); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
async function dbAll() { const d = await DB; if (!d) return []; return new Promise((ok) => { const q = d.transaction('b').objectStore('b').getAll(); q.onsuccess = () => ok(q.result); q.onerror = () => ok([]); }); }

function describe(items) {
  const files = items.filter((x) => !isT(x)), texts = items.filter((x) => isT(x));
  if (!files.length) return isUrl(texts[0]?.text) ? 'Link' : 'Text';
  const imgs = files.filter(isImg).length, vids = files.filter(isVid).length;
  if (imgs === files.length) return imgs === 1 ? 'Photo' : `${imgs} photos`;
  if (vids === files.length) return vids === 1 ? 'Video' : `${vids} videos`;
  return files.length === 1 ? files[0].name : `${files.length} files`;
}
function when(t) { const d = new Date(t), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { day: 'numeric', month: 'short' }); }
function folderEl(b, fresh) {
  const el = document.createElement('div'); el.className = 'fold' + (fresh ? ' in' : '');
  const papers = b.items.slice(0, 3).map((x) => {
    if (isT(x)) return `<div class="paper"><div class="big">${isUrl(x.text) ? '🔗' : '💬'}</div></div>`;
    if (isImg(x)) return `<div class="paper"><img src="${URL.createObjectURL(x)}"></div>`;
    return `<div class="paper"><div class="ln"></div><div class="ln"></div><div class="ln s"></div></div>`;
  }).reverse().join('');
  el.innerHTML = `<div class="fv"><div class="back"></div>${papers}<div class="front"></div></div><div class="lb">${esc(describe(b.items))}</div><div class="sb">${esc(b.from)} · ${when(b.time)}</div>`;
  el.onclick = () => openFolder(b);
  return el;
}
function addFolder(b, fresh) { $('#folders .empty')?.remove(); $('#clear').classList.remove('hidden'); $('#folders').prepend(folderEl(b, fresh)); }
async function received(b) {
  delete b.got; delete b.total;
  addFolder(b, true); dbPut(b); buzz([10, 40, 10]);
  island(b.from, 'Received · ' + describe(b.items), 1);
  const t = b.items.find((x) => isT(x));
  if (!isPhone) {
    for (const f of b.items) if (!isT(f)) download(f);
    if (t && isUrl(t.text)) toast('Link from ' + b.from + ' · Open', () => window.open(t.text.trim(), '_blank'));
    else if (t) navigator.clipboard.writeText(t.text).then(() => toast('Copied from ' + b.from), () => {});
  } else if (t) toast(b.from + ' sent ' + (isUrl(t.text) ? 'a link' : 'text') + ' · Tap to copy', () => copy(t.text));
}
function download(f) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }
async function copy(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { toast('Couldn’t copy'); } }
async function saveFiles(files) {
  if (isPhone && navigator.canShare?.({ files })) { try { await navigator.share({ files }); } catch {} }
  else files.forEach(download);
}
function openFolder(b) {
  const files = b.items.filter((x) => !isT(x));
  const rows = b.items.map((x, i) => isT(x)
    ? `<div class="r" data-a="t${i}"><div class="th">${isUrl(x.text) ? '🔗' : '💬'}</div><div class="nm wrap">${esc(x.text)}</div><div class="act">${isUrl(x.text) ? 'Open' : 'Copy'}</div></div>`
    : `<div class="r" data-a="f${i}">${isImg(x) ? `<img class="th" src="${URL.createObjectURL(x)}">` : `<div class="th">${icon(x)}</div>`}<div class="nm">${esc(x.name)}</div><div class="act">Save</div></div>`).join('');
  showSheet(`<h3>${esc(describe(b.items))}</h3><p>${esc(b.from)} · ${when(b.time)}</p><div class="rows">${rows}</div>
    <div class="btns">${files.length > 1 ? '<button class="btn pri" data-a="all">Save all</button>' : ''}<button class="btn" data-a="close">Close</button></div>`, (a) => {
    if (a === 'all') { saveFiles(files); return 'keep'; }
    if (a[0] === 't') { const t = b.items[+a.slice(1)].text; isUrl(t) ? window.open(t.trim(), '_blank') : copy(t); return 'keep'; }
    if (a[0] === 'f') { saveFiles([b.items[+a.slice(1)]]); return 'keep'; }
  });
}

    t.onclick = (e) => { e.stopPropagation(); if (e.target.classList.contains('x')) { picked.splice(i, 1); renderTray(); buzz(10); } else previewSheet(i); };

}
function previewSheet(i) {

    <div class="btns"><button class="btn" data-a="rm">Remove</button><button class="btn pri" data-a="close">Keep</button></div>`, (a) => { if (a === 'rm') { picked.splice(i, 1); renderTray(); } });
}
async function flick() {

  if (!targetPeer()) return toast(Object.keys(trusted).length ? 'Open Flick on your other device' : 'Tap someone in Nearby, or pair a device');
  const files = picked; picked = [];

}
async function toPdf(images) {
  const { jsPDF } = window.jspdf; let doc;
  for (const f of images) {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(f); });
    const s = Math.min(1, 2000 / Math.max(img.width, img.height)), w = img.width * s, h = img.height * s;
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    const o = w > h ? 'l' : 'p';
    if (!doc) doc = new jsPDF({ orientation: o, unit: 'px', format: [w, h] }); else doc.addPage([w, h], o);
    doc.addImage(c.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, w, h);
  }
  const d = new Date();
  return new File([doc.output('blob')], `Scan ${d.toISOString().slice(0, 10)} ${d.getHours()}-${String(d.getMinutes()).padStart(2, '0')}.pdf`, { type: 'application/pdf' });
}

if (isPhone) {

// ---------- laptop: drop, throw up ----------
if (!isPhone) {
  const stage = $('#stage');
  hint.innerHTML = '<div class="ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div><b>Drop files here</b><small>Throw them up to send · Double-click to remove</small>';
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('over'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('over'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault(); stage.classList.remove('over');
    const r = stage.getBoundingClientRect();
    [...e.dataTransfer.files].forEach((f, i) => chip(f, e.clientX - r.left - 46 + i * 16, e.clientY - r.top - 60 + i * 16));
  });
  addEventListener('paste', (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) files.forEach((f, i) => chip(f, 40 + i * 20, 40 + i * 20));
    else { const t = e.clipboardData?.getData('text'); if (t) sendBatch([{ text: t }]); }
  });
  function chip(file, x, y) {
    hint.classList.add('hidden'); stage.classList.add('ready');
    const c = document.createElement('div'); c.className = 'tile glass chip';
    const u = URL.createObjectURL(file);
    c.innerHTML = isImg(file) ? `<img src="${u}">` : isVid(file) ? `<video src="${u}#t=0.1" muted preload="metadata"></video><div class="vb">▶ Video</div>` : `<div style="font-size:30px">${icon(file)}</div>${esc(file.name)}`;
    c.ondblclick = () => { c.remove(); if (!stage.querySelector('.chip')) { hint.classList.remove('hidden'); stage.classList.remove('ready'); } };
    stage.append(c);
    let px = Math.max(0, Math.min(x, stage.clientWidth - 94)), py = Math.max(0, Math.min(y, stage.clientHeight - 120));
    const place = () => (c.style.transform = `translate(${px}px,${py}px)`); place();
    let s, trail = [];
    c.onpointerdown = (e) => { c.setPointerCapture(e.pointerId); s = { x: e.clientX - px, y: e.clientY - py }; trail = [{ y: e.clientY, t: e.timeStamp }]; };
    c.onpointermove = (e) => { if (!s) return; px = e.clientX - s.x; py = e.clientY - s.y; place(); trail.push({ y: e.clientY, t: e.timeStamp }); if (trail.length > 6) trail.shift(); };
    c.onpointerup = () => {
      if (!s) return; s = null;
      const a = trail[0], b = trail[trail.length - 1];
      if ((b.y - a.y) / Math.max(1, b.t - a.t) > -0.7 && py > -30) return;
      if (!targetPeer()) return toast(Object.keys(trusted).length ? 'Open Flick on your iPhone' : 'Tap someone in Nearby, or pair a device');
      flyUp(c);
      setTimeout(() => { c.remove(); if (!stage.querySelector('.chip')) { hint.classList.remove('hidden'); stage.classList.remove('ready'); } }, 1750);
      sendBatch([file]);
    };
  }
}

// ---------- profile photo ----------
$('#photoIn').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  const c = document.createElement('canvas'), n = 128, m = Math.min(img.width, img.height); c.width = c.height = n;
  c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, n, n);

  const sm = document.createElement('canvas'); sm.width = sm.height = 48; sm.getContext('2d').drawImage(c, 0, 0, 48, 48); me.avatarSm = sm.toDataURL('image/jpeg', .7);

// ---------- Flick for Windows on this laptop (same identity, shared pairing) ----------
let helper = null, helperInfo = null, helperFirst;
const helperReady = new Promise((r) => (helperFirst = r));
function helperConnect() {
  if (isPhone) return helperFirst();
  try { helper = new WebSocket('ws://127.0.0.1:4041'); } catch { helperFirst(); return setTimeout(helperConnect, 8000); }
  helper.onerror = () => helperFirst();
  helper.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hi') {
      helperInfo = m;
      const changed = me.id !== m.id;
      Object.assign(me, { id: m.id, name: m.name, model: m.model }); store.set('me', me);
      for (const [id, v] of Object.entries(m.trusted || {})) { trusted[id] = v.name; if (v.avatar) avatars[id] = v.avatar; }
      store.set('trusted', trusted); store.set('avatars', avatars);
      if (changed && mq) { mq.end(true); connectBroker(0); }
      helperFirst(); renderTitle();
    }
    if (m.t === 'trusted') { const p = peers.get(m.id) || { id: m.id, name: m.name, kind: 'phone' }; peers.set(m.id, p); if (m.avatar) setAvatar(m.id, m.avatar); trust(p); paired(p); }
    if (m.t === 'untrusted') { const p = peers.get(m.id); if (p) forget(p); }
  };
  helper.onclose = () => { helper = null; helperInfo = null; helperFirst(); setTimeout(helperConnect, 8000); };
}
function helperSend(m) { if (helper?.readyState === 1) helper.send(JSON.stringify(m)); }
function sendCaps() {}
helperConnect();

// ---------- find my phone ----------
let ringing;
$('#ringBtn').onclick = () => { const p = live().find((x) => x.kind === 'phone'); if (p) { p.dc.send(JSON.stringify({ t: 'ring' })); toast('Ringing ' + p.name); } };
function ringMe(from) {
  if (ringing) return;
  const beep = () => { try { sfx('down'); } catch {} buzz([300, 150, 300]); };
  beep(); ringing = setInterval(beep, 1600);
  showSheet(`<div style="display:flex;justify-content:center;margin-bottom:10px"><div class="dv" style="width:64px;height:64px;border-radius:20px;color:#fff;box-shadow:0 0 40px rgba(80,150,255,.6)">${ico('bell')}</div></div><h3>${esc(from)} is looking for this phone</h3>
    <div class="btns"><button class="btn pri" data-a="found">Found it</button></div>`, () => { clearInterval(ringing); ringing = null; });
}

// ---------- phone: control the laptop ----------
const pendingRes = new Map(); let shots = {};
async function cmd(id, a, arg) {
  if (!keys[id]) throw new Error('not paired');
  const n = rid(8); toDev(id, { type: 'cmd', ...(await sealFor(id, { a, arg, ts: Date.now(), n })) });
  return n;
}
async function onRes(p, m) {
  let r; try { r = await openBox(b64d(keys[p.id]), m); } catch { return; }
  if (r.r === 'status') { Object.assign(p, { battery: r.battery, charging: r.charging, model: r.model || p.model }); renderHero(p); }
  if (r.r === 'shot') {
    const s = (shots[r.id] ||= []); s[r.i] = r.d;
    if (s.filter(Boolean).length === r.n) { const el = $('#shot'); if (el) el.innerHTML = `<img src="data:image/jpeg;base64,${s.join('')}">`; delete shots[r.id]; }
  }
}
let unlocked = false;
async function verifyOwner() { // Face ID / Touch ID / screen lock before controlling the laptop
  if (unlocked) return true;
  try {
    if (!window.PublicKeyCredential) return (unlocked = true);
    const rnd = (n) => crypto.getRandomValues(new Uint8Array(n)), id = store.get('pk');
    if (!id) {
      const c = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'Flick' }, user: { id: rnd(16), name: me.name, displayName: me.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' }, timeout: 60000 } });
      store.set('pk', b64e(c.rawId));
    } else await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: b64d(id) }], userVerification: 'required', timeout: 60000 } });
    return (unlocked = true);
  } catch (e) { if (e?.name === 'NotAllowedError') { toast('Not verified'); return false; } return (unlocked = true); }
}
function batRing(p) {
  if (p.battery == null) return `<div class="bat"><span>${ico('laptop')}</span></div>`;
  const c = 2 * Math.PI * 23, col = p.charging ? '#3ddc97' : p.battery <= 20 ? '#ff6b6b' : '#4b8dff';
  return `<div class="bat"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="27" cy="27" r="23" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p.battery / 100)}" style="filter:drop-shadow(0 0 6px ${col})"/></svg><span>${p.charging ? '<svg class="ic" style="width:14px;height:14px;color:#3ddc97" viewBox="0 0 24 24">' + I.bolt + '</svg>' : ''}${p.battery}%</span></div>`;
}
function renderHero(p) { const h = $('#hero'); if (h) h.innerHTML = `${devIcon(p)}<div class="tx"><b>${esc(p.name)}</b><small>${esc(p.model || 'Windows PC')}${p.battery != null ? ' · ' + (p.charging ? 'Charging' : 'On battery') : ''}</small></div>${batRing(p)}`; }
const T4 = (items) => `<div class="tiles">${items.map(([a, i, l, w]) => `<button class="tl${w ? ' warn' : ''}" data-a="${a}">${ico(i)}${l}</button>`).join('')}</div>`;
async function remoteSheet() {
  const p = [...peers.values()].find(remoteOk);
  if (!p) {
    const any = Object.keys(keys).length;
    const near = [...peers.values()].find((x) => Date.now() - (x.helperSeen || 0) < 20000 && !keys[x.id]);
    if (near) return showSheet(`<h3>Pair ${esc(near.name)}</h3><p>${esc(near.model || 'Your laptop')} is ready. Pair it once to control it.</p>
      <div class="btns"><button class="btn" data-a="close">Not now</button><button class="btn pri" data-a="pair">Pair</button></div>`, (a) => { if (a === 'pair') { askPair(near); return 'keep'; } });
    return showSheet(`<h3>Control your laptop</h3><p>${any ? 'Your laptop is off, asleep or offline' : 'Open Flick for Windows on your laptop and keep both on the same Wi-Fi'}</p>
      <div class="btns">${any ? '' : '<button class="btn" data-a="get">Get Flick for Windows</button>'}<button class="btn pri" data-a="close">OK</button></div>`, (a) => { if (a === 'get') window.open('https://github.com/moyososvbL/Flick/releases/tag/windows', '_blank'); });
  }
  if (!(await verifyOwner())) return;
  const run = (a, arg) => { cmd(p.id, a, arg); buzz(8); };
  showSheet(`<div class="hero" id="hero"></div>
    <div class="shot" id="shot" data-a="shot">${ico('camera')}See screen</div>
    <div class="lbl">Media</div>${T4([['track_prev', 'tprev', 'Previous'], ['play', 'play', 'Play'], ['track_next', 'tnext', 'Next'], ['mute', 'mute', 'Mute']])}
    ${T4([['voldown', 'vdown', 'Vol −'], ['volup', 'vup', 'Vol +'], ['pad', 'pointer', 'Trackpad'], ['kb', 'keyboard', 'Type']])}
    <div class="lbl">Slides</div>${T4([['prev', 'prev', 'Back'], ['next', 'next', 'Next'], ['slideshow', 'present', 'Start'], ['endshow', 'stop', 'End']])}
    <div class="lbl">Open</div>${T4([['open:chrome', 'globe', 'Chrome'], ['open:files', 'folder', 'Files'], ['open:youtube', 'youtube', 'YouTube'], ['desktop', 'desktop', 'Desktop']])}
    <div class="lbl">Power</div>${T4([['lock', 'lock', 'Lock'], ['sleep', 'moon', 'Sleep'], ['restart', 'restart', 'Restart', 1], ['shutdown', 'power', 'Shut down', 1]])}
    <div class="btns"><button class="btn" data-a="close">Done</button></div>`, (a) => {
    if (a === 'close') return;
    if (a === 'shot') { $('#shot').innerHTML = '<small>Taking screenshot…</small>'; run('shot'); return 'keep'; }
    if (a === 'pad') { padSheet(p); return 'keep'; }
    if (a === 'kb') { padSheet(p, true); return 'keep'; }
    if (a === 'restart' || a === 'shutdown') {
      const what = a === 'restart' ? 'Restart' : 'Shut down';
      showSheet(`<h3>${what} ${esc(p.name)}?</h3><p>It will ${a === 'restart' ? 'restart' : 'turn off'} in 10 seconds. Unsaved work may be lost.</p>
        <div class="btns"><button class="btn" data-a="back">Cancel</button><button class="btn pri" style="background:linear-gradient(180deg,#ff6b6b,#e04848)" data-a="go">${what}</button></div>`, (b) => {
        if (b === 'go') { run(a); toast(`${what} in 10s · tap to stop`, () => run('cancel')); }
        if (b === 'back') { remoteSheet(); return 'keep'; }
      });
      return 'keep';
    }
    const [act, arg] = a.split(':'); run(act, arg); return 'keep';
  }, 'remote');
  renderHero(p); run('status');
}
function padSheet(p, typing) {
  showSheet(`<h3>${typing ? 'Type on ' + esc(p.name) : 'Trackpad'}</h3>
    ${typing ? '' : '<div class="pad" id="pad">Tap to click · Two fingers to scroll · Two-finger tap to right-click</div>'}
    <div class="kb"><input id="kbIn" placeholder="Type here…" autocomplete="off" ${typing ? 'autofocus' : ''}/><button class="btn pri" style="flex:none;padding:13px 18px" data-a="send">Send</button></div>
    <div class="btns"><button class="btn" data-a="bk">⌫</button><button class="btn" data-a="enter">Enter</button><button class="btn" data-a="back">Done</button></div>`, (a) => {
    if (a === 'send') { const v = $('#kbIn').value; if (v) cmd(p.id, 'type', v); $('#kbIn').value = ''; return 'keep'; }
    if (a === 'enter') { cmd(p.id, 'enter'); return 'keep'; }
    if (a === 'bk') { cmd(p.id, 'backspace'); return 'keep'; }
    if (a === 'back') { remoteSheet(); return 'keep'; }
  }, 'pad');
  $('#kbIn').onkeydown = (e) => { if (e.key === 'Enter') { const v = e.target.value; cmd(p.id, v ? 'type' : 'enter', v ? v + '\n' : undefined); e.target.value = ''; } };
  const pad = $('#pad'); if (!pad) return;
  let last = null, moved = 0, acc = [0, 0], two = false, t0 = 0, sy = 0;
  const flush = setInterval(() => { if (!$('#pad')) return clearInterval(flush); const mx = Math.trunc(acc[0]), my = Math.trunc(acc[1]); if (mx || my) { cmd(p.id, 'move', [mx, my]); acc = [acc[0] - mx, acc[1] - my]; } }, 40);
  pad.ontouchstart = (e) => { e.preventDefault(); two = e.touches.length > 1; t0 = Date.now(); moved = 0; last = [e.touches[0].clientX, e.touches[0].clientY]; sy = 0; };
  pad.ontouchmove = (e) => {
    e.preventDefault(); const t = e.touches[0], dx = t.clientX - last[0], dy = t.clientY - last[1]; last = [t.clientX, t.clientY]; moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length > 1) { sy += dy; if (Math.abs(sy) > 18) { cmd(p.id, 'scroll', Math.round(-sy * 4)); sy = 0; } return; }
    const sp = Math.hypot(dx, dy), k = 0.9 + Math.min(1.3, sp * sp / 400); acc[0] += dx * k; acc[1] += dy * k;
  };
  pad.ontouchend = (e) => { e.preventDefault(); if (e.touches.length) return; if (moved < 8 && Date.now() - t0 < 300) { cmd(p.id, two ? 'rclick' : 'click'); buzz(8); } two = false; };
}
if (isPhone) $('#remote').onclick = remoteSheet;

// ---------- Edge Drop (Flick for Windows) ----------
if (window.flickDesktop) {
  window.flickDesktop.onFiles(async (list) => {
    const files = list.map((x) => new File([x.data], x.name, { type: x.type || '' }));

  setInterval(() => { const p = targetPeer(); window.flickDesktop.target(p ? { name: p.name, av: avatars[p.id] || p.av || '' } : null); }, 2000);
}
